<script type="application/json" id="__NUXT_DATA__" data-ssr="true">[["Reactive",1],{"data":2,"state":20,"once":22,"_errors":23,"serverRendered":25,"path":26,"pinia":27},{"getActivityDetail":3},{"Data":4},{"MetaTitle":5,"MetaKeywords":6,"MetaDescription":5,"Id":7,"Picture":8,"Title":9,"SubTitle":5,"Description":10,"Content":11,"Sort":12,"VideoCode":5,"DocumentFile":5,"StartOn":13,"EndOn":14,"ActivityStartOn":15,"ActivityEndOn":16,"LocationId":17,"ActivityTypeId":18,"PhotoList":19},"","金宇園,哪吒,海洋之心",1045,"https://admin.px-sunmake.org.tw/Public/show/1045/官網960-660臨水劇場.png","11月主題劇場「哪吒海底歷險記—海洋之心」","親子布袋戲X哪吒X守護海洋環境","\u003Cp>\u003Cimg src=\"https://admin.px-sunmake.org.tw/Public/show/1045/1040-1040_1臨水劇場.png\" alt=\"X\" />\u003C/p>\u003Cp>\u003Cspan style=\"font-size:large;\">&nbsp;\u003C/span>\u003C/p>\u003Cp>\u003Cspan style=\"font-size:large;\">【11月主題劇場】\u003C/span>\u003Cbr />\u003Cspan style=\"font-size:large;\">節目名稱：哪吒海底歷險記&mdash;海洋之心\u003C/span>\u003Cbr />\u003Cspan style=\"font-size:large;\">演出日期：2026/11/1~11/30\u003C/span>\u003Cbr />\u003Cspan style=\"font-size:large;\">演出團隊：金宇園掌中劇團\u003C/span>\u003Cbr />\u003Cspan style=\"font-size:large;\">演出地點：臨水劇場\u003C/span>\u003Cbr />\u003Cspan style=\"font-size:large;\">演出場次：每日13:00，週五至週日 加演15:30\u003C/span>\u003C/p>\u003Cp>\u003Cspan style=\"font-size:large;color:#ff00ff;\">註：11/8(日)因配合孔廟活動，原15：30場次移至11/9(一)15：30演出。\u003C/span>\u003C/p>\u003Cp>\u003Cspan style=\"font-size:large;\">&nbsp;\u003C/span>\u003C/p>\u003Cp>\u003Cspan style=\"font-size:large;\">\u003Cstrong>演出團隊簡介：\u003C/strong>\u003C/span>\u003C/p>\u003Cp>\u003Cspan style=\"font-size:large;\">金宇園掌中劇團於2008年由趙金統創立，致力於打破傳統古冊戲與金光戲的框架，發展「創藝」布袋戲。劇團作品題材多元且技術不斷創新：2015年《靈魂當舖》探討現代婚姻與善惡議題；2016年《戲藝人生》改編自父輩真實經歷，見證布袋戲興衰，並首創上下舞台演出；2017年《任意門》更率先導入旋轉舞臺呈現科幻題材。此外，劇團也推出《冰龍戰記》等親子劇，深耕年輕世代。金宇園曾多次榮獲雲林國際偶戲節金掌獎，並五度獲選為臺中市傑出團隊。作品更遠播海外，多次受邀至日本、加拿大與澳門等地演出，以天馬行空的多元表演形式，讓世界看見臺灣布袋戲的全新面貌。\u003C/span>\u003C/p>\u003Cp>\u003Cspan style=\"font-size:large;\">&nbsp;\u003C/span>\u003C/p>\u003Cp>\u003Cspan style=\"font-size:large;\">\u003Cstrong>演出節目介紹：\u003C/strong>\u003C/span>\u003C/p>\u003Cp>\u003Cspan style=\"font-size:large;\">哪吒在好友阿瓜的引導下，帶著蘊含神秘力量的「海洋之心」潛入海底。原本不會游泳的哪吒，在奇幻的海底世界結識了小丑魚與海龜爺爺，並得知人類大量排放廢棄物，不但已嚴重汙染海洋，更解開了惡魔溝深處的「垃圾大魔王」的封印。面對浩劫，東海龍王太子龍俊率領魚蝦水族挺身而出，與哪吒等人會合抗敵。然而大魔王吸收垃圾廢料後力量大增，眾人陷入苦戰。關鍵時刻，哪吒拿出「海洋之心」，匯聚大家守護海洋的信念與力量，最終成功擊敗大魔王。本劇以生動冒險，與和觀眾熱情互動的橋段，傳遞團結環保、共同守護海洋環境的核心精神。\u003C/span>\u003C/p>\u003Cp>\u003Cspan style=\"font-size:large;\">&nbsp;\u003C/span>\u003C/p>\u003Cp>\u003Cspan style=\"font-size:large;\">&nbsp;\u003C/span>\u003C/p>\u003Cp>\u003Cspan style=\"font-size:large;\">&nbsp;\u003C/span>\u003C/p>\u003Cp>\u003Cspan style=\"font-size:large;\">&nbsp;\u003C/span>\u003C/p>",0,"2026-09-16T13:34:21","2035-12-31T00:00:00","2026-11-01T13:34:21","2026-11-30T13:34:21",4,2,[],{"$snuxt-i18n-meta":21},{},["Set"],{"getActivityDetail":24},null,true,"/show/1045",{"parameter":28},{"lang":29},["Ref",30],"zh_TW"]</script>
