<script id="__NEXT_DATA__">{"props":{"pageProps":{"data":{"id":307,"priority":999,"title":"2026礁溪溫泉馬拉松","alias":"","summary":"","description":"\u003cspan style=\"color:#00bcd4;\"\u003e\u003cstrong\u003e✨「2026礁溪溫泉馬拉松」活動請踴躍參加✨\u003c/strong\u003e\u003c/span\u003e\u003cbr /\u003e\r\n\u003cbr /\u003e\r\n活動日期：2026年12月12日（六）\u003cbr /\u003e\r\n活動地點：礁溪國小\u003cbr /\u003e\r\n賽事組別：42K全馬組／21K半馬組／10K健跑組／3K親子組\u003cbr /\u003e\r\n\u003cbr /\u003e\r\n這場被跑者譽為「全台最美、最好跑」的平地溫泉馬拉松，不只結合了礁溪獨有的溫泉風光，還有熱情鄉親、澎湃在地補給，場場口碑爆棚、場場搶報。無論你是新手或老鳥，來跑過一次就上癮！\u003cbr /\u003e\r\n\u003cbr /\u003e\r\n\u003cstrong\u003e✨日台港代言陣容\u003c/strong\u003e\u003cbr /\u003e\r\n今年賽事邀請「宜蘭在地前排球國手」張怡潔，以及「日籍萌系長跑女神」島田千緩（千千）擔任雙代言人，另外特別邀請香港代言人Elton Lam共同參與，熱情號召跑者們齊聚礁溪國小，一起感受這場充滿魅力與溫度的馬拉松盛會！\u003cbr /\u003e\r\n\u003cbr /\u003e\r\n\u003cstrong\u003e✨賽道美景及澎湃補給\u003c/strong\u003e\u003cbr /\u003e\r\n邁入第十四屆的礁溪馬，賽事分為全程馬拉松（42公里）、半程馬拉松（21公里）、健跑組（10公里）及親子組（3公里），賽道經過湯圍溝溫泉公園、柴圍佃圳水門公園、三民濕地、龍潭湖風景區與水稻遠山景觀等地，沿途更提供金棗茶、一串心、燒鴨油雞等特色補給，在奔馳之際補足體力，讓參賽者一邊跑一邊飽覽蘭陽平原秀麗風光。\u003cbr /\u003e\r\n\u003cbr /\u003e\r\n\u003cstrong\u003e✨永續愛地球\u003c/strong\u003e\u003cbr /\u003e\r\n同時響應低碳環保趨勢，今年賽事也全力推動綠色永續行動：選手衣全面使用環保紗材質、完賽證書採電子發放，更與運動筆記共同倡議「綠色跑者精神」，鼓勵跑者自備水杯，實踐「一杯到底，永續有你」的行動口號，為地球盡一份力。\u003cbr /\u003e\r\n\u003cbr /\u003e\r\n\u0026nbsp;","hits":616,"date_posted":"2026-07-23T00:00:00","date_modified":"2026-07-23T19:37:29.4863965","links":[{"name":"報名網站","url":"https://irunner.biji.co/2026jiaoxihotspring"},{"name":"礁溪鄉公所FB","url":"https://www.facebook.com/jiaoxi.eland"},{"name":"礁溪溫泉馬拉松FB","url":"https://www.facebook.com/jiaoximarathon/"}],"images":[{"outsite":false,"isCover":false,"isNormal":true,"isSample":false,"isBanner":false,"subject":"2026礁溪溫泉馬拉松宣傳海報","width":1920,"height":2716,"url":"https://travel.yilan.gov.tw/_api/content/images/articles/27783/480x360_articles-image-yrmar5tm5uoqeik85cunng.jpg","ext":".jpg","albumName":"2026礁溪溫泉馬拉松","album_id":3433}],"files":[],"categories":[1,155,168],"categoryNames":["活動資訊","協助宣傳"]},"locale":"zh-tw"},"__N_SSP":true},"page":"/news/[id]","query":{"id":"307"},"buildId":"v8IVhb23dFuJvfknphB0q","isFallback":false,"isExperimentalCompile":false,"gssp":true,"locale":"zh-tw","locales":["default","zh-tw"],"defaultLocale":"default","scriptLoader":[]}</script>
